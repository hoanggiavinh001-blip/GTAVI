<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA VI FANMADE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #87ceeb;
    font-family: Arial, sans-serif;
}

#game {
    width: 100vw;
    height: 100vh;
}

#ui {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    z-index: 10;
    text-shadow: 2px 2px 5px black;
}

#title {
    font-size: 25px;
    font-weight: bold;
    color: #ffcc55;
}

#money {
    margin-top: 8px;
    font-size: 18px;
}

#help {
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: white;
    background: #0009;
    padding: 12px;
    border-radius: 8px;
    line-height: 1.7;
}

#status {
    position: absolute;
    top: 20px;
    right: 20px;
    color: white;
    background: #0009;
    padding: 12px;
    border-radius: 8px;
}

</style>
</head>

<body>

<div id="game"></div>

<div id="ui">
    <div id="title">GTA VI FANMADE</div>
    <div id="money">$ 500</div>
</div>

<div id="status">VICE CITY</div>

<div id="help">
    WASD: Di chuyển<br>
    SHIFT: Chạy<br>
    E: Lên / xuống xe<br>
    Chuột: Xoay camera<br>
    SPACE: Nhảy
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';


// =========================
// SCENE
// =========================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(0x87ceeb, 100, 650);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    1500
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

document.getElementById("game").appendChild(
    renderer.domElement
);


// =========================
// LIGHT
// =========================

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(100, 200, 100);

sun.castShadow = true;

scene.add(sun);

scene.add(
    new THREE.AmbientLight(0xffffff, 1.2)
);


// =========================
// MATERIALS
// =========================

const grassMat = new THREE.MeshStandardMaterial({
    color: 0x568c45
});

const roadMat = new THREE.MeshStandardMaterial({
    color: 0x333333
});

const buildingColors = [
    0xd5c4a1,
    0xc5d4dc,
    0xd8b6a1,
    0xa8b7c4,
    0xe2d7c5,
    0xb5c6a0
];


// =========================
// GROUND
// =========================

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1000, 1000),
    grassMat
);

ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


// =========================
// CITY
// =========================

const buildings = [];

function createBuilding(x, z, w, h, d) {

    const color = buildingColors[
        Math.floor(Math.random() * buildingColors.length)
    ];

    const building = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({
            color: color
        })
    );

    building.position.set(x, h / 2, z);

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);

    buildings.push({
        mesh: building,
        x,
        z,
        w,
        d
    });

    // Windows

    for(let y = 2; y < h - 1; y += 3) {

        for(let wx = -w/2 + 2; wx < w/2 - 1; wx += 3) {

            const windowMesh = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.3, 0.1),
                new THREE.MeshStandardMaterial({
                    color: 0x75c9e8,
                    metalness: 0.3,
                    roughness: 0.2
                })
            );

            windowMesh.position.set(
                x + wx,
                y,
                z + d/2 + 0.06
            );

            scene.add(windowMesh);

        }
    }

}


// =========================
// ROAD SYSTEM
// =========================

function createRoad(x, z, w, d) {

    const road = new THREE.Mesh(
        new THREE.BoxGeometry(w, 0.15, d),
        roadMat
    );

    road.position.set(x, 0.05, z);

    scene.add(road);

}

for(let i = -400; i <= 400; i += 100) {

    createRoad(i, 0, 24, 900);

    createRoad(0, i, 900, 24);

}


// Road markings

const lineMat = new THREE.MeshBasicMaterial({
    color: 0xffffff
});

for(let i = -400; i <= 400; i += 15) {

    const line = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.03, 5),
        lineMat
    );

    line.position.set(i, 0.15, 0);

    scene.add(line);

}


// Buildings

for(let x = -400; x <= 400; x += 50) {

    for(let z = -400; z <= 400; z += 50) {

        if(
            Math.abs(x % 100) < 1 ||
            Math.abs(z % 100) < 1
        ) continue;

        createBuilding(
            x + (Math.random() - 0.5) * 10,
            z + (Math.random() - 0.5) * 10,
            20 + Math.random() * 15,
            15 + Math.random() * 65,
            20 + Math.random() * 15
        );

    }

}


// =========================
// PLAYER
// =========================

const loader = new GLTFLoader();

const player = new THREE.Group();

scene.add(player);

let playerModel = null;

let playerLoaded = false;

function createDefaultPlayer() {

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(1, 2, 0.6),
        new THREE.MeshStandardMaterial({
            color: 0x0066ff
        })
    );

    body.position.y = 1;

    body.castShadow = true;

    player.add(body);

}

createDefaultPlayer();

loader.load(
    './jason_duval.glb',

    function(gltf) {

        player.remove(player.children[0]);

        playerModel = gltf.scene;

        playerModel.scale.set(1, 1, 1);

        playerModel.position.set(0, 0, 0);

        playerModel.traverse(obj => {

            if(obj.isMesh) {
                obj.castShadow = true;
            }

        });

        player.add(playerModel);

        playerLoaded = true;

        console.log("Jason loaded!");

    },

    undefined,

    function() {

        console.log("Không tìm thấy Jason, dùng nhân vật khối xanh.");

    }
);

player.position.set(0, 0, 0);


// =========================
// PLAYER MOVEMENT
// =========================

const keys = {};

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

let velocityY = 0;

let onGround = true;

function updatePlayer() {

    if(driving) return;

    const speed = keys["shift"] ? 0.35 : 0.16;

    let dx = 0;
    let dz = 0;

    if(keys["w"]) dz -= speed;
    if(keys["s"]) dz += speed;
    if(keys["a"]) dx -= speed;
    if(keys["d"]) dx += speed;

    if(dx !== 0 || dz !== 0) {

        const length = Math.sqrt(dx*dx + dz*dz);

        dx /= length;
        dz /= length;

        player.position.x += dx * speed * 4;
        player.position.z += dz * speed * 4;

        player.rotation.y = Math.atan2(dx, dz);

        // Procedural walking animation

        if(playerModel) {

            playerModel.position.y =
                Math.abs(Math.sin(Date.now() * 0.012)) * 0.08;

        }

    }

    // Jump

    if(keys[" "] && onGround) {

        velocityY = 0.22;
        onGround = false;

    }

    velocityY -= 0.012;

    player.position.y += velocityY;

    if(player.position.y <= 0) {

        player.position.y = 0;

        velocityY = 0;

        onGround = true;

    }

    checkBuildingCollision(player);

}


// =========================
// BUILDING COLLISION
// =========================

function checkBuildingCollision(object) {

    for(const b of buildings) {

        const dx = Math.abs(object.position.x - b.x);

        const dz = Math.abs(object.position.z - b.z);

        if(
            dx < b.w/2 + 1 &&
            dz < b.d/2 + 1
        ) {

            object.position.x -=
                Math.sign(object.position.x - b.x) * 0.5;

            object.position.z -=
                Math.sign(object.position.z - b.z) * 0.5;

        }

    }

}


// =========================
// NPC SYSTEM
// =========================

const npcs = [];

function createNPC(x, z) {

    const npc = new THREE.Group();

    scene.add(npc);

    let npcModel = null;

    const color = new THREE.Color().setHSL(
        Math.random(),
        0.7,
        0.5
    );

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 1.8, 0.6),
        new THREE.MeshStandardMaterial({
            color: color
        })
    );

    body.position.y = 0.9;

    npc.add(body);

    npc.position.set(x, 0, z);

    // Optional Tommy model

    loader.load(
        './tommy_vercetti_cutscene_model.glb',

        function(gltf) {

            if(npcModel) return;

            npc.remove(body);

            npcModel = gltf.scene;

            npcModel.scale.set(1, 1, 1);

            npc.add(npcModel);

        },

        undefined,

        function() {}
    );

    npcs.push({

        object: npc,

        direction: Math.random() * Math.PI * 2,

        timer: Math.random() * 200,

        speed: 0.035,

        knocked: false,

        knockVelocity: new THREE.Vector3()

    });

}


// Create 40 NPCs

for(let i = 0; i < 40; i++) {

    createNPC(
        (Math.random() - 0.5) * 700,
        (Math.random() - 0.5) * 700
    );

}


// NPC AI

function updateNPCs() {

    npcs.forEach(npc => {

        const obj = npc.object;

        if(npc.knocked) {

            obj.position.add(npc.knockVelocity);

            npc.knockVelocity.multiplyScalar(0.92);

            if(npc.knockVelocity.length() < 0.02) {

                npc.knocked = false;

                obj.rotation.x = 0;

                obj.rotation.z = 0;

            }

            return;

        }

        npc.timer--;

        if(npc.timer <= 0) {

            npc.direction =
                Math.random() * Math.PI * 2;

            npc.timer = 100 + Math.random() * 200;

        }

        obj.position.x +=
            Math.sin(npc.direction) * npc.speed;

        obj.position.z +=
            Math.cos(npc.direction) * npc.speed;

        obj.rotation.y = npc.direction;

        // Avoid player

        const distance = obj.position.distanceTo(
            player.position
        );

        if(distance < 3) {

            npc.direction = Math.atan2(
                obj.position.x - player.position.x,
                obj.position.z - player.position.z
            );

        }

    });

}


// =========================
// VEHICLES
// =========================

const cars = [];

let driving = false;

let currentCar = null;

function createCar(x, z) {

    const car = new THREE.Group();

    scene.add(car);

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 0.8, 4.5),
        new THREE.MeshStandardMaterial({
            color: 0xc62828,
            metalness: 0.5,
            roughness: 0.3
        })
    );

    body.position.y = 0.8;

    body.castShadow = true;

    car.add(body);

    const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, 0.8, 2),
        new THREE.MeshStandardMaterial({
            color: 0x222222
        })
    );

    cabin.position.set(0, 1.5, -0.3);

    car.add(cabin);

    const wheels = [];

    for(let wx of [-1.1, 1.1]) {

        for(let wz of [-1.4, 1.4]) {

            const wheel = new THREE.Mesh(
                new THREE.CylinderGeometry(
                    0.4, 0.4, 0.25, 16
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x111111
                })
            );

            wheel.rotation.z = Math.PI / 2;

            wheel.position.set(wx, 0.4, wz);

            car.add(wheel);

            wheels.push(wheel);

        }

    }

    car.position.set(x, 0, z);

    // Optional vehicle model

    loader.load(
        './3d_vapid_creado_gta_vi_game-ready_low_poly.glb',

        function(gltf) {

            car.remove(body);
            car.remove(cabin);

            wheels.forEach(w => car.remove(w));

            const model = gltf.scene;

            model.scale.set(1, 1, 1);

            car.add(model);

        },

        undefined,

        function() {}

    );

    cars.push({

        object: car,

        speed: 0,

        health: 100,

        wheels: wheels,

        body: body,

        dents: []

    });

}

for(let i = 0; i < 12; i++) {

    createCar(
        Math.random() * 300 - 150,
        Math.random() * 300 - 150
    );

}


// =========================
// CAR DRIVING
// =========================

function updateCars() {

    if(!driving || !currentCar) return;

    const car = currentCar;

    if(keys["w"]) car.speed += 0.008;

    if(keys["s"]) car.speed -= 0.012;

    car.speed *= 0.985;

    car.speed = THREE.MathUtils.clamp(
        car.speed,
        -0.4,
        1.0
    );

    if(keys["a"]) {
        car.object.rotation.y += car.speed * 0.04;
    }

    if(keys["d"]) {
        car.object.rotation.y -= car.speed * 0.04;
    }

    car.object.position.x +=
        Math.sin(car.object.rotation.y) * car.speed;

    car.object.position.z +=
        Math.cos(car.object.rotation.y) * car.speed;

    car.wheels.forEach(w => {
        w.rotation.x += car.speed * 0.1;
    });

    // Car collision with buildings

    for(const b of buildings) {

        const distance = Math.sqrt(
            (car.object.position.x - b.x) ** 2 +
            (car.object.position.z - b.z) ** 2
        );

        if(distance < 15) {

            car.speed *= -0.3;

            car.health = Math.max(
                0,
                car.health - 5
            );

            createDent(car);

        }

    }

    player.position.copy(car.object.position);

    player.position.y = 0;

}


// Simple visual damage

function createDent(car) {

    if(car.dents.length >= 5) return;

    const dent = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.15, 0.15),
        new THREE.MeshStandardMaterial({
            color: 0x222222
        })
    );

    dent.position.set(
        (Math.random() - 0.5) * 1.8,
        1.1,
        (Math.random() - 0.5) * 3.5
    );

    car.object.add(dent);

    car.dents.push(dent);

}


// =========================
// ENTER / EXIT CAR
// =========================

window.addEventListener("keydown", e => {

    if(e.key.toLowerCase() !== "e") return;

    if(!driving) {

        let closest = null;

        let minDistance = 5;

        cars.forEach(car => {

            const d = player.position.distanceTo(
                car.object.position
            );

            if(d < minDistance) {

                minDistance = d;

                closest = car;

            }

        });

        if(closest) {

            currentCar = closest;

            driving = true;

            player.visible = false;

        }

    } else {

        driving = false;

        player.visible = true;

        player.position.x += 3;

        currentCar = null;

    }

});


// =========================
// NPC COLLISION REACTION
// =========================

function checkNPCPlayerCollision() {

    npcs.forEach(npc => {

        const distance = npc.object.position.distanceTo(
            player.position
        );

        if(distance < 1.3 && !npc.knocked && !driving) {

            npc.knocked = true;

            const direction = new THREE.Vector3(
                npc.object.position.x - player.position.x,
                0,
                npc.object.position.z - player.position.z
            ).normalize();

            npc.knockVelocity.copy(direction).multiplyScalar(0.25);

            npc.object.rotation.z = 0.4;

        }

    });

}


// =========================
// CAMERA
// =========================

let cameraAngle = 0;

let cameraDistance = 9;

let mouseDown = false;

window.addEventListener("mousedown", () => {
    mouseDown = true;
});

window.addEventListener("mouseup", () => {
    mouseDown = false;
});

window.addEventListener("mousemove", e => {

    if(mouseDown) {

        cameraAngle -= e.movementX * 0.005;

    }

});

function updateCamera() {

    const target = driving && currentCar
        ? currentCar.object.position
        : player.position;

    const distance = driving ? 12 : cameraDistance;

    const x = target.x - Math.sin(cameraAngle) * distance;

    const z = target.z - Math.cos(cameraAngle) * distance;

    const y = target.y + (driving ? 6 : 5);

    camera.position.lerp(
        new THREE.Vector3(x, y, z),
        0.1
    );

    camera.lookAt(
        target.x,
        target.y + 1,
        target.z
    );

}


// =========================
// GAME LOOP
// =========================

function animate() {

    requestAnimationFrame(animate);

    updatePlayer();

    updateNPCs();

    updateCars();

    checkNPCPlayerCollision();

    updateCamera();

    renderer.render(scene, camera);

}

animate();


// =========================
// RESIZE
// =========================

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
