<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GTA VI FANMADE</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:Arial;color:white}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;z-index:5;background:#0009;padding:12px;border-radius:10px}
#message{position:fixed;top:75px;left:50%;transform:translateX(-50%);background:#000b;padding:10px 18px;border-radius:8px;z-index:10}
#controls{position:fixed;bottom:25px;left:20px;z-index:10}
#joystick{width:130px;height:130px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff80;position:relative;touch-action:none}
#joystickKnob{width:48px;height:48px;border-radius:50%;background:#fff9;position:absolute;left:39px;top:39px;pointer-events:none}
#buttons{position:fixed;right:20px;bottom:35px;display:flex;flex-direction:column;gap:12px;z-index:10}
button{border:0;border-radius:12px;padding:15px 20px;background:#16a36a;color:white;font-weight:bold;font-size:16px}
#enterBtn{background:#e69b27}
#hint{position:fixed;right:15px;top:15px;background:#0009;padding:10px;border-radius:8px}
</style>
</head>
<body>

<div id="hud">
  <b>GTA VI FANMADE</b><br>
  Tiền: $<span id="money">500</span><br>
  Trạng thái: <span id="status">Đi bộ</span>
</div>

<div id="message">Chào mừng đến thành phố!</div>
<div id="hint">WASD: Di chuyển | E: Lên/xuống xe</div>

<div id="controls">
  <div id="joystick"><div id="joystickKnob"></div></div>
</div>

<div id="buttons">
  <button id="enterBtn">🚗 LÊN / XUỐNG XE</button>
  <button id="runBtn">CHẠY NHANH</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87bce5);
scene.fog = new THREE.Fog(0x87bce5, 100, 350);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526070,2));
const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(50,100,50);
sun.castShadow = true;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),
  new THREE.MeshStandardMaterial({color:0x43844a})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Đường phố
function road(x,z,w,d){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,.08,d),
  new THREE.MeshStandardMaterial({color:0x292d32})
 );
 m.position.set(x,.04,z);
 scene.add(m);
}
road(0,.1,500,18);
road(0,0,18,500);

for(let i=-220;i<=220;i+=12){
 const line=new THREE.Mesh(
  new THREE.BoxGeometry(.25,.1,5),
  new THREE.MeshBasicMaterial({color:0xffffff})
 );
 line.position.set(i,.12,0);
 scene.add(line);
 const line2=line.clone();
 line2.rotation.y=Math.PI/2;
 line2.position.set(0,.12,i);
 scene.add(line2);
}

// Nhà cửa
const buildings=[];
for(let x=-180;x<=180;x+=30){
 for(let z=-180;z<=180;z+=30){
  if(Math.abs(x)<20||Math.abs(z)<20)continue;
  const h=8+Math.random()*24;
  const mesh=new THREE.Mesh(
   new THREE.BoxGeometry(18,h,18),
   new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.55+Math.random()*.1,.18,.35+Math.random()*.2)})
  );
  mesh.position.set(x,h/2,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
  buildings.push(mesh);
 }
}

// Nhân vật
const player=new THREE.Group();
const body=new THREE.Mesh(
 new THREE.BoxGeometry(1,1.5,.55),
 new THREE.MeshStandardMaterial({color:0x2455a4})
);
body.position.y=1.5;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.38,16,16),
 new THREE.MeshStandardMaterial({color:0xd8a477})
);
head.position.y=2.5;
player.add(head);

const legs=[];
for(let i=0;i<2;i++){
 const leg=new THREE.Mesh(
  new THREE.BoxGeometry(.28,.8,.3),
  new THREE.MeshStandardMaterial({color:0x222222})
 );
 leg.position.set(i===0?-.22:.22,.65,0);
 player.add(leg);
 legs.push(leg);
}
player.position.set(0,0,5);
scene.add(player);

// Xe
const cars=[];
function createCar(x,z,color=0xe83c35){
 const car=new THREE.Group();
 const base=new THREE.Mesh(
  new THREE.BoxGeometry(2.3,.7,4.2),
  new THREE.MeshStandardMaterial({color})
 );
 base.position.y=.65;
 car.add(base);

 const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(1.8,.8,2),
  new THREE.MeshStandardMaterial({color:0x222e3b})
 );
 cabin.position.set(0,1.35,-.2);
 car.add(cabin);

 const wheels=[];
 for(const wx of [-1.15,1.15]){
  for(const wz of [-1.35,1.35]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.38,.38,.25,16),
    new THREE.MeshStandardMaterial({color:0x111111})
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(wx,.4,wz);
   car.add(wheel);
   wheels.push(wheel);
  }
 }
 car.position.set(x,0,z);
 scene.add(car);
 const data={mesh:car,wheels,speed:0};
 cars.push(data);
 return data;
}

createCar(5,5,0xe83c35);
createCar(15,15,0x2365cc);
createCar(-15,-15,0xffffff);
createCar(30,10,0x222222);

let currentVehicle=null;
let inVehicle=false;

// Joystick
const joystick=document.getElementById('joystick');
const knob=document.getElementById('joystickKnob');
let joyX=0,joyY=0,joyActive=false;

function updateJoystick(e){
 const rect=joystick.getBoundingClientRect();
 const cx=rect.left+rect.width/2;
 const cy=rect.top+rect.height/2;
 let dx=e.clientX-cx;
 let dy=e.clientY-cy;
 const max=42;
 const len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 joyX=dx/max;
 // Kéo lên (dy âm) tạo giá trị tiến dương
 joyY=-dy/max;
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}
function resetJoystick(){
 joyActive=false;
 joyX=0;
 joyY=0;
 knob.style.transform='translate(0px,0px)';
}
joystick.addEventListener('pointerdown',e=>{
 joyActive=true;
 joystick.setPointerCapture(e.pointerId);
 updateJoystick(e);
});
joystick.addEventListener('pointermove',e=>{
 if(joyActive)updateJoystick(e);
});
joystick.addEventListener('pointerup',resetJoystick);
joystick.addEventListener('pointercancel',resetJoystick);

// Bàn phím
const keys={};
window.addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==='e')toggleVehicle();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function showMessage(text){
 const el=document.getElementById('message');
 el.textContent=text;
 el.style.display='block';
 clearTimeout(showMessage.timer);
 showMessage.timer=setTimeout(()=>el.style.display='none',2200);
}

// Lên / xuống xe
function toggleVehicle(){
 if(inVehicle){
  const car=currentVehicle.mesh;
  const forward=new THREE.Vector3(0,0,1).applyQuaternion(car.quaternion);
  player.position.copy(car.position).add(forward.multiplyScalar(3));
  player.position.y=0;
  player.visible=true;
  currentVehicle.speed=0;
  currentVehicle=null;
  inVehicle=false;
  document.getElementById('status').textContent='Đi bộ';
  showMessage('Bạn đã xuống xe');
  return;
 }

 let nearest=null;
 let nearestDistance=6;

 for(const car of cars){
  const d=player.position.distanceTo(car.mesh.position);
  if(d<nearestDistance){
   nearest=car;
   nearestDistance=d;
  }
 }

 if(!nearest){
  showMessage('Hãy đến gần một chiếc xe!');
  return;
 }

 currentVehicle=nearest;
 inVehicle=true;
 player.visible=false;
 document.getElementById('status').textContent='Đang lái xe';
 showMessage('Đã lên xe! Nhấn E để xuống.');
}

document.getElementById('enterBtn').addEventListener('pointerdown',e=>{
 e.preventDefault();
 toggleVehicle();
});

let running=false;
document.getElementById('runBtn').addEventListener('pointerdown',()=>running=true);
document.getElementById('runBtn').addEventListener('pointerup',()=>running=false);
document.getElementById('runBtn').addEventListener('pointerleave',()=>running=false);

// Va chạm nhà
function blocked(position){
 for(const b of buildings){
  const dx=Math.abs(position.x-b.position.x);
  const dz=Math.abs(position.z-b.position.z);
  if(dx<9.8&&dz<9.8)return true;
 }
 return false;
}

const clock=new THREE.Clock();
const direction=new THREE.Vector3();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 let forward=joyY;
 let sideways=joyX;

 if(keys.w||keys.arrowup)forward=1;
 if(keys.s||keys.arrowdown)forward=-1;
 if(keys.a||keys.arrowleft)sideways=-1;
 if(keys.d||keys.arrowright)sideways=1;

 const cameraForward=new THREE.Vector3();
 camera.getWorldDirection(cameraForward);
 cameraForward.y=0;
 cameraForward.normalize();

 const cameraRight=new THREE.Vector3()
  .crossVectors(cameraForward,new THREE.Vector3(0,1,0))
  .normalize();

 if(inVehicle&&currentVehicle){
  const car=currentVehicle.mesh;
  const acceleration=forward*22;
  currentVehicle.speed+=acceleration*dt;
  currentVehicle.speed*=Math.pow(.94,dt*60);
  currentVehicle.speed=THREE.MathUtils.clamp(currentVehicle.speed,-12,35);

  car.rotation.y-=sideways*dt*1.8*(Math.abs(currentVehicle.speed)/12+.2);

  const move=new THREE.Vector3(0,0,1)
   .applyQuaternion(car.quaternion)
   .multiplyScalar(currentVehicle.speed*dt);

  const next=car.position.clone().add(move);
  if(!blocked(next))car.position.copy(next);
  else currentVehicle.speed=0;

  currentVehicle.wheels.forEach(w=>w.rotation.x+=currentVehicle.speed*dt*2);
 }else{
  const move=new THREE.Vector3();
  move.addScaledVector(cameraForward,forward);
  move.addScaledVector(cameraRight,sideways);

  if(move.length()>1)move.normalize();

  const speed=running||keys.shift?10:5;
  const next=player.position.clone().addScaledVector(move,speed*dt);

  if(!blocked(next))player.position.copy(next);

  if(move.length()>.05){
   player.rotation.y=Math.atan2(move.x,move.z);
   legs[0].rotation.x=Math.sin(performance.now()*.012)*.7;
   legs[1].rotation.x=-Math.sin(performance.now()*.012)*.7;
  }else{
   legs.forEach(l=>l.rotation.x=0);
  }
 }

 // Camera theo nhân vật hoặc xe
 const target=inVehicle&&currentVehicle
  ?currentVehicle.mesh.position
  :player.position;

 const camOffset=inVehicle
  ?new THREE.Vector3(0,7,-12)
  :new THREE.Vector3(0,6,-9);

 const desired=target.clone().add(camOffset);
 camera.position.lerp(desired,1-Math.pow(.001,dt));
 camera.lookAt(target.x,target.y+1.5,target.z);

 renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
