<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>GTA VI FANMADE</title>

<!-- FIX THREE.JS IMPORT -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #87ceeb;
    font-family: Arial;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

#ui {
    position: fixed;
    top: 15px;
    left: 20px;
    color: white;
    z-index: 10;
    text-shadow: 2px 2px 5px black;
    pointer-events: none;
}

#title {
    font-size: 25px;
    font-weight: bold;
    color: #ffcc55;
}

#money {
    margin-top: 10px;
    font-size: 20px;
}

#status {
    position: fixed;
    top: 15px;
    right: 15px;
    color: white;
    background: #263d49cc;
    padding: 15px;
    border-radius: 12px;
    z-index: 10;
}

#help {
    position: fixed;
    bottom: 15px;
    left: 15px;
    color: white;
    background: #263d49dd;
    padding: 12px;
    border-radius: 12px;
    line-height: 1.8;
    font-size: 14px;
    z-index: 10;
    pointer-events: none;
}

#controls {
    position: fixed;
    right: 20px;
    bottom: 25px;
    display: grid;
    grid-template-columns: repeat(3, 55px);
    gap: 8px;
    z-index: 20;
}

.btn {
    width: 55px;
    height: 55px;
    border: 1px solid white;
    border-radius: 12px;
    background: #263d49bb;
    color: white;
    font-size: 22px;
    touch-action: none;
}

#message {
    position: fixed;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #111c;
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    z-index: 30;
    display: none;
}

#error {
    position: fixed;
    inset: 10px;
    top: auto;
    bottom: 100px;
    height: fit-content;
    color: white;
    background: #990000dd;
    padding: 15px;
    border-radius: 10px;
    z-index: 100;
    display: none;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="ui">
    <div id="title">GTA VI FANMADE</div>
    <div id="money">$ 500</div>
</div>

<div id="status">VICE CITY</div>

<div id="help">
    WASD: Di chuyển<br>
    SHIFT: Chạy<br>
    E: Lên / xuống xe<br>
    SPACE: Nhảy<br>
    Kéo màn hình: Xoay camera
</div>

<div id="message"></div>
<div id="error"></div>

<div id="controls">
    <button class="btn" data-key="w" style="grid-column:2">▲</button>
    <button class="btn" data-key="a">◀</button>
    <button class="btn" data-key="s">▼</button>
    <button class="btn" data-key="d">▶</button>
    <button class="btn" data-key="shift">⚡</button>
    <button class="btn" data-key="e">E</button>
    <button class="btn" data-key=" ">⬆</button>
</div>

<script type="module">

import * as THREE from 'three';

import { GLTFLoader } from
'three/addons/loaders/GLTFLoader.js';


// ===================================
// ERROR DISPLAY
// ===================================

const errorBox = document.getElementById("error");

function showError(error) {
    errorBox.style.display = "block";
    errorBox.textContent = "GAME ERROR: " + error;
    console.error(error);
}

window.addEventListener("error", e => {
    showError(e.message);
});

window.addEventListener("unhandledrejection", e => {
    showError(e.reason);
});


// ===================================
// GAME SETTINGS
// ===================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x91cce8);

scene.fog = new THREE.Fog(0x91cce8, 180, 850);

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    1500
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(innerWidth, innerHeight);

renderer.setPixelRatio(
    Math.min(devicePixelRatio, 1.5)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.getElementById("game").appendChild(
    renderer.domElement
);


// ===================================
// LIGHTING
// ===================================

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x536b42,
    2
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2.5
);

sun.position.set(100, 200, 100);

sun.castShadow = true;

sun.shadow.mapSize.set(1024, 1024);

scene.add(sun);


// ===================================
// MATERIALS
// ===================================

const materials = {
    grass: new THREE.MeshStandardMaterial({
        color: 0x588b4c
    }),

    road: new THREE.MeshStandardMaterial({
        color: 0x34383b
    }),

    sidewalk: new THREE.MeshStandardMaterial({
        color: 0x999999
    }),

    window: new THREE.MeshStandardMaterial({
        color: 0x75c9e8,
        metalness: 0.3,
        roughness: 0.2
    })
};


// ===================================
// GROUND
// ===================================

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1200, 1200),
    materials.grass
);

ground.rotation.x = -Math.PI / 2;

ground.position.y = -0.1;

ground.receiveShadow = true;

scene.add(ground);


// ===================================
// CITY BUILDINGS
// ===================================

const buildings = [];

const colors = [
    0xd5c4a1,
    0xc5d4dc,
    0xd8b6a1,
    0xa8b7c4,
    0xe2d7c5,
    0xb5c6a0,
    0xe3c2a2
];

function createBuilding(x, z, w, h, d) {

    const building = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({
            color: colors[
                Math.floor(Math.random() * colors.length)
            ]
        })
    );

    building.position.set(x, h / 2, z);

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);

    buildings.push({
        mesh: building,
        x: x,
        z: z,
        w: w,
        d: d
    });

    // Windows

    const windowGeometry = new THREE.BoxGeometry(
        1.5, 1.5, 0.1
    );

    for(let y = 3; y < h - 1; y += 3) {

        for(let wx = -w/2 + 2; wx < w/2 - 1; wx += 4) {

            const win = new THREE.Mesh(
                windowGeometry,
                materials.window
            );

            win.position.set(
                x + wx,
                y,
                z + d/2 + 0.06
            );

            scene.add(win);
        }
    }

}


// ===================================
// ROADS
// ===================================

function createRoad(x, z, w, d) {

    const road = new THREE.Mesh(
        new THREE.BoxGeometry(w, 0.15, d),
        materials.road
    );

    road.position.set(x, 0, z);

    road.receiveShadow = true;

    scene.add(road);

}

for(let i = -500; i <= 500; i += 100) {

    createRoad(i, 0, 24, 1100);

    createRoad(0, i, 1100, 24);

}


// Road markings

const lineMat = new THREE.MeshBasicMaterial({
    color: 0xffffff
});

for(let i = -500; i <= 500; i += 12) {

    const line = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.03, 4),
        lineMat
    );

    line.position.set(i, 0.09, 0);

    scene.add(line);

}


// ===================================
// BUILDING GENERATION
// ===================================

for(let x = -450; x <= 450; x += 100) {

    for(let z = -450; z <= 450; z += 100) {

        for(let sx of [-25, 25]) {

            for(let sz of [-25, 25]) {

                const height = 15 + Math.random() * 65;

                createBuilding(
                    x + sx,
                    z + sz,
                    20,
                    height,
                    20
                );

            }
        }
    }
}


// ===================================
// PLAYER
// ===================================

const loader = new GLTFLoader();

const player = new THREE.Group();

scene.add(player);

player.position.set(0, 0, 0);

let playerModel = null;

let mixer = null;

let animations = {};

let currentAnimation = null;


// Blue fallback character

function createDefaultPlayer() {

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 1.8, 0.6),
        new THREE.MeshStandardMaterial({
            color: 0x0066ff
        })
    );

    body.position.y = 0.9;

    body.castShadow = true;

    const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.55, 0.55, 0.55),
        new THREE.MeshStandardMaterial({
            color: 0x0066ff
        })
    );

    head.position.y = 2.05;

    head.castShadow = true;

    player.add(body);
    player.add(head);

}

createDefaultPlayer();


// Load Jason

loader.load(
    './jason_duval.glb',

    gltf => {

        player.remove(...player.children);

        playerModel = gltf.scene;

        playerModel.scale.setScalar(1);

        playerModel.position.set(0, 0, 0);

        playerModel.traverse(obj => {

            if(obj.isMesh) {
                obj.castShadow = true;
                obj.receiveShadow = true;
            }

        });

        player.add(playerModel);

        if(gltf.animations.length > 0) {

            mixer = new THREE.AnimationMixer(playerModel);

            gltf.animations.forEach(clip => {

                animations[clip.name.toLowerCase()] =
                    mixer.clipAction(clip);

            });

            console.log("Jason animations:", gltf.animations.map(a => a.name));

        }

        console.log("Jason loaded!");

    },

    undefined,

    error => {
        console.log("Jason không tải được, dùng khối xanh.", error);
    }
);


// ===================================
// NPC
// ===================================

const npcs = [];

let tommyModel = null;

loader.load(
    './tommy_vercetti_cutscene_model.glb',

    gltf => {

        tommyModel = gltf.scene;

        console.log("Tommy model loaded!");

    },

    undefined,

    error => console.log("Dùng NPC khối màu:", error)
);


function createNPC(x, z) {

    const npc = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 1.8, 0.6),
        new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(
                Math.random(), 0.7, 0.5
            )
        })
    );

    body.position.y = 0.9;

    npc.add(body);

    npc.position.set(x, 0, z);

    scene.add(npc);

    npcs.push({
        object: npc,
        direction: Math.random() * Math.PI * 2,
        timer: 100,
        knocked: false,
        velocity: new THREE.Vector3()
    });

}

for(let i = 0; i < 20; i++) {

    createNPC(
        Math.random() * 300 - 150,
        Math.random() * 300 - 150
    );

}


// Use Tommy model for newly created NPCs

function updateTommyNPCs() {

    if(!tommyModel) return;

    npcs.forEach(npc => {

        if(npc.object.userData.modelLoaded) return;

        npc.object.clear();

        const model = tommyModel.clone(true);

        model.scale.setScalar(1);

        npc.object.add(model);

        npc.object.userData.modelLoaded = true;

    });

}


// ===================================
// NPC MOVEMENT
// ===================================

function updateNPCs(delta) {

    for(const npc of npcs) {

        const obj = npc.object;

        if(npc.knocked) {

            obj.position.addScaledVector(
                npc.velocity,
                delta * 60
            );

            npc.velocity.multiplyScalar(
                Math.pow(0.92, delta * 60)
            );

            if(npc.velocity.length() < 0.02) {

                npc.knocked = false;

                obj.rotation.x = 0;
                obj.rotation.z = 0;

            }

            continue;
        }

        npc.timer--;

        if(npc.timer <= 0) {

            npc.direction = Math.random() * Math.PI * 2;

            npc.timer = 100 + Math.random() * 200;

        }

        obj.position.x +=
            Math.sin(npc.direction) * delta * 3;

        obj.position.z +=
            Math.cos(npc.direction) * delta * 3;

        obj.rotation.y = npc.direction;

    }

}


// ===================================
// VEHICLES
// ===================================

const cars = [];

let carModel = null;

loader.load(
    './3d_vapid_creado_gta_vi_game-ready_low_poly.glb',

    gltf => {

        carModel = gltf.scene;

        console.log("Vehicle model loaded!");

    },

    undefined,

    error => console.log("Dùng xe mặc định:", error)
);


function createCar(x, z) {

    const car = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 0.8, 4.5),
        new THREE.MeshStandardMaterial({
            color: 0xc62828
        })
    );

    body.position.y = 0.8;

    car.add(body);

    const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, 0.8, 2),
        new THREE.MeshStandardMaterial({
            color: 0x222222
        })
    );

    cabin.position.set(0, 1.5, -0.3);

    car.add(cabin);

    const wheels = [];

    for(const wx of [-1.1, 1.1]) {

        for(const wz of [-1.4, 1.4]) {

            const wheel = new THREE.Mesh(
                new THREE.CylinderGeometry(
                    0.4, 0.4, 0.25, 16
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x111111
                })
            );

            wheel.rotation.z = Math.PI / 2;

            wheel.position.set(wx, 0.4, wz);

            car.add(wheel);

            wheels.push(wheel);

        }

    }

    car.position.set(x, 0, z);

    scene.add(car);

    cars.push({
        object: car,
        body: body,
        wheels: wheels,
        speed: 0,
        damage: 0,
        modelLoaded: false
    });

}

for(let i = 0; i < 8; i++) {

    createCar(
        Math.random() * 150 - 75,
        Math.random() * 150 - 75
    );

}


// Load vehicle model into cars

function updateCarModels() {

    if(!carModel) return;

    cars.forEach(car => {

        if(car.modelLoaded) return;

        car.object.clear();

        const model = carModel.clone(true);

        model.scale.setScalar(1);

        car.object.add(model);

        car.modelLoaded = true;

    });

}


// ===================================
// CONTROLS
// ===================================

const keys = {};

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

});

window.addEventListener("keyup", e => {

    keys[e.key.toLowerCase()] = false;

});

document.querySelectorAll(".btn").forEach(btn => {

    const key = btn.dataset.key;

    btn.addEventListener("pointerdown", e => {
        e.preventDefault();
        keys[key] = true;
    });

    btn.addEventListener("pointerup", () => {
        keys[key] = false;
    });

    btn.addEventListener("pointerleave", () => {
        keys[key] = false;
    });

    btn.addEventListener("pointercancel", () => {
        keys[key] = false;
    });

});


// ===================================
// CAMERA
// ===================================

let cameraAngle = 0;

let dragging = false;

let lastX = 0;

renderer.domElement.addEventListener(
    "pointerdown", e => {

        dragging = true;

        lastX = e.clientX;

    }
);

window.addEventListener("pointerup", () => {
    dragging = false;
});

window.addEventListener("pointermove", e => {

    if(!dragging) return;

    cameraAngle -= (e.clientX - lastX) * 0.006;

    lastX = e.clientX;

});


// ===================================
// PLAYER COLLISION
// ===================================

function checkBuildingCollision(object) {

    for(const b of buildings) {

        const dx = object.position.x - b.x;

        const dz = object.position.z - b.z;

        if(
            Math.abs(dx) < b.w/2 + 0.7 &&
            Math.abs(dz) < b.d/2 + 0.7
        ) {

            if(Math.abs(dx) > Math.abs(dz)) {
                object.position.x = b.x +
                    Math.sign(dx || 1) * (b.w/2 + 0.8);
            } else {
                object.position.z = b.z +
                    Math.sign(dz || 1) * (b.d/2 + 0.8);
            }

        }

    }

}


// ===================================
// PLAYER MOVEMENT
// ===================================

let velocityY = 0;

let onGround = true;

let driving = false;

let currentCar = null;

function updatePlayer(delta) {

    if(driving) return;

    let dx = 0;
    let dz = 0;

    const speed = keys["shift"] ? 13 : 6;

    if(keys["w"]) dz -= 1;
    if(keys["s"]) dz += 1;
    if(keys["a"]) dx -= 1;
    if(keys["d"]) dx += 1;

    if(dx !== 0 || dz !== 0) {

        const length = Math.hypot(dx, dz);

        dx /= length;
        dz /= length;

        const oldX = player.position.x;
        const oldZ = player.position.z;

        player.position.x += dx * speed * delta;

        player.position.z += dz * speed * delta;

        player.rotation.y = Math.atan2(dx, dz);

        checkBuildingCollision(player);

        // Procedural animation

        if(playerModel && !mixer) {

            playerModel.position.y =
                Math.abs(Math.sin(Date.now() * 0.012)) * 0.08;

        }

        // Prevent movement into buildings
        if(
            player.position.x === oldX &&
            player.position.z === oldZ
        ) {
            // Collision stopped movement
        }

    }

    if(keys[" "] && onGround) {

        velocityY = 8;

        onGround = false;

    }

    velocityY -= 20 * delta;

    player.position.y += velocityY * delta;

    if(player.position.y < 0) {

        player.position.y = 0;

        velocityY = 0;

        onGround = true;

    }

}


// ===================================
// ENTER / EXIT CAR
// ===================================

function enterExitCar() {

    if(!driving) {

        let closest = null;

        let minDistance = 5;

        cars.forEach(car => {

            const d = player.position.distanceTo(
                car.object.position
            );

            if(d < minDistance) {

                minDistance = d;

                closest = car;

            }

        });

        if(closest) {

            currentCar = closest;

            driving = true;

            player.visible = false;

            showMessage("Đã vào xe!");

        }

    } else {

        driving = false;

        player.visible = true;

        player.position.copy(currentCar.object.position);

        player.position.x += 3;

        currentCar = null;

        showMessage("Đã xuống xe!");

    }

}

window.addEventListener("keydown", e => {

    if(e.key.toLowerCase() === "e" && !e.repeat) {

        enterExitCar();

    }

});

document.querySelector('[data-key="e"]').addEventListener(
    "click", enterExitCar
);


// ===================================
// DRIVE
// ===================================

function updateCars(delta) {

    if(!driving || !currentCar) return;

    const car = currentCar;

    if(keys["w"]) car.speed += 8 * delta;

    if(keys["s"]) car.speed -= 12 * delta;

    car.speed *= Math.pow(0.985, delta * 60);

    car.speed = THREE.MathUtils.clamp(
        car.speed, -12, 35
    );

    if(keys["a"]) {
        car.object.rotation.y += car.speed * 0.002;
    }

    if(keys["d"]) {
        car.object.rotation.y -= car.speed * 0.002;
    }

    car.object.position.x +=
        Math.sin(car.object.rotation.y) * car.speed * delta;

    car.object.position.z +=
        Math.cos(car.object.rotation.y) * car.speed * delta;

    car.wheels.forEach(w => {
        w.rotation.x += car.speed * delta;
    });

    player.position.copy(car.object.position);

    player.position.y = 0;

}


// ===================================
// MESSAGE
// ===================================

let messageTimer;

function showMessage(text) {

    const el = document.getElementById("message");

    el.textContent = text;

    el.style.display = "block";

    clearTimeout(messageTimer);

    messageTimer = setTimeout(() => {
        el.style.display = "none";
    }, 2000);

}


// ===================================
// CAMERA UPDATE
// ===================================

function updateCamera() {

    const target = driving && currentCar
        ? currentCar.object.position
        : player.position;

    const distance = driving ? 13 : 9;

    const desired = new THREE.Vector3(

        target.x - Math.sin(cameraAngle) * distance,

        target.y + (driving ? 6 : 5),

        target.z - Math.cos(cameraAngle) * distance

    );

    camera.position.lerp(desired, 0.12);

    camera.lookAt(
        target.x,
        target.y + 1,
        target.z
    );

}


// ===================================
// ANIMATION
// ===================================

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    updatePlayer(delta);

    updateNPCs(delta);

    updateCars(delta);

    updateTommyNPCs();

    updateCarModels();

    if(mixer) {
        mixer.update(delta);
    }

    updateCamera();

    renderer.render(scene, camera);

}

camera.position.set(0, 8, 15);

camera.lookAt(0, 0, 0);

animate();


// ===================================
// RESIZE
// ===================================

window.addEventListener("resize", () => {

    camera.aspect = innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(innerWidth, innerHeight);

});

console.log("GTA VI FANMADE STARTED!");

</script>

</body>
</html>
