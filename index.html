<script type="module">

import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {clone as cloneSkeleton} from 'three/addons/utils/SkeletonUtils.js';


// =====================================================
// 1. SCENE
// =====================================================

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x91cce8);
scene.fog=new THREE.Fog(0x91cce8,150,700);

const camera=new THREE.PerspectiveCamera(
65,
innerWidth/innerHeight,
.1,
1200
);

let renderer;

try{

renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

}catch(error){

document.getElementById("message").style.display="block";
document.getElementById("message").textContent="Thiết bị không hỗ trợ WebGL.";

throw error;

}

renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526b42,2));

const sun=new THREE.DirectionalLight(0xffffff,2);

sun.position.set(100,150,100);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);

scene.add(sun);

const loader=new GLTFLoader();

const buildings=[];


// =====================================================
// 2. GROUND AND ROADS
// =====================================================

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(1100,1100),
new THREE.MeshStandardMaterial({color:0x54864b})
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);

function road(x,z,w,d){

const mesh=new THREE.Mesh(
new THREE.BoxGeometry(w,.12,d),
new THREE.MeshStandardMaterial({color:0x303438})
);

mesh.position.set(x,0,z);

scene.add(mesh);

}

for(let i=-500;i<=500;i+=100){

road(i,0,23,1100);
road(0,i,1100,23);

}

for(let i=-500;i<=500;i+=12){

const line=new THREE.Mesh(
new THREE.BoxGeometry(.25,.03,4),
new THREE.MeshBasicMaterial({color:0xffffff})
);

line.position.set(i,.08,0);

scene.add(line);

}


// =====================================================
// 3. BUILDINGS
// =====================================================

const buildingColors=[
0xd9c4a5,
0xc5d4dc,
0xe2d4c5,
0xa9b9c6,
0xd7b5a1,
0x9daea0
];

function createBuilding(x,z,w,h,d){

const group=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({
color:buildingColors[
Math.floor(Math.random()*buildingColors.length)
]
})
);

body.position.y=h/2;
body.castShadow=true;
body.receiveShadow=true;

group.add(body);

const windowMat=new THREE.MeshStandardMaterial({
color:0x65b5d6
});

for(let y=3;y<h-2;y+=3){

for(let wx=-w/2+2;wx<w/2-1;wx+=4){

const win=new THREE.Mesh(
new THREE.BoxGeometry(1.5,1.4,.08),
windowMat
);

win.position.set(wx,y,d/2+.05);

group.add(win);

}

}

group.position.set(x,0,z);

scene.add(group);

buildings.push({x,z,w,d,group});

return group;

}

for(let x=-450;x<=450;x+=100){

for(let z=-450;z<=450;z+=100){

for(const sx of [-25,25]){

for(const sz of [-25,25]){

const bx=x+sx;
const bz=z+sz;

if(Math.abs(bx-35)<18&&Math.abs(bz-35)<18)continue;

createBuilding(
bx,
bz,
20,
18+Math.random()*55,
20
);

}

}

}

}


// =====================================================
// 4. COLLISION
// =====================================================

function checkBuildingCollision(object,radius=.7){

let collided=false;

for(const b of buildings){

const dx=object.position.x-b.x;
const dz=object.position.z-b.z;

if(
Math.abs(dx)<b.w/2+radius&&
Math.abs(dz)<b.d/2+radius
){

collided=true;

if(Math.abs(dx)>Math.abs(dz)){

object.position.x=
b.x+Math.sign(dx||1)*(b.w/2+radius);

}else{

object.position.z=
b.z+Math.sign(dz||1)*(b.d/2+radius);

}

}

}

return collided;

}


// =====================================================
// 5. MODEL NORMALIZATION
// =====================================================

function normalizeModel(model,height){

const box=new THREE.Box3().setFromObject(model);
const size=box.getSize(new THREE.Vector3());

if(size.y>0){

model.scale.multiplyScalar(height/size.y);

}

const b=new THREE.Box3().setFromObject(model);
const center=b.getCenter(new THREE.Vector3());

model.position.x-=center.x;
model.position.z-=center.z;
model.position.y-=b.min.y;

}


// =====================================================
// 6. CHARACTER
// =====================================================

function createCharacter(color=0x0066ff){

const rig=new THREE.Group();

const mat=new THREE.MeshStandardMaterial({color});

const torso=new THREE.Mesh(
new THREE.BoxGeometry(.8,.9,.5),
mat
);

torso.position.y=1.3;

rig.add(torso);

const head=new THREE.Mesh(
new THREE.BoxGeometry(.5,.5,.5),
mat
);

head.position.y=2;

rig.add(head);

function limb(x,y){

const pivot=new THREE.Group();

pivot.position.set(x,y,0);

const mesh=new THREE.Mesh(
new THREE.BoxGeometry(.23,.8,.23),
mat
);

mesh.position.y=-.4;

pivot.add(mesh);
rig.add(pivot);

return pivot;

}

rig.userData.parts={

torso,

leftArm:limb(-.5,1.7),
rightArm:limb(.5,1.7),

leftLeg:limb(-.22,.9),
rightLeg:limb(.22,.9)

};

return rig;

}


// =====================================================
// 7. PLAYER
// =====================================================

const player=new THREE.Group();

scene.add(player);

player.position.set(0,0,0);

let playerMixer=null;
let playerActions={};
let activePlayerAction=null;
let playerModel=null;

let playerRig=createCharacter();

player.add(playerRig);

loader.load(
'./jason_duval.glb',

gltf=>{

player.remove(playerRig);

playerModel=gltf.scene;

normalizeModel(playerModel,1.8);

player.add(playerModel);

if(gltf.animations.length){

playerMixer=new THREE.AnimationMixer(playerModel);

gltf.animations.forEach(clip=>{

playerActions[clip.name.toLowerCase()]=
playerMixer.clipAction(clip);

});

}

},

undefined,

()=>console.log("Dùng nhân vật mặc định")

);

function playPlayerAnimation(type){

if(!playerMixer)return;

const names=Object.keys(playerActions);

let name=names.find(n=>n.includes(type));

if(!name&&names.length)name=names[0];

if(!name)return;

const next=playerActions[name];

if(activePlayerAction!==next){

next.reset();
next.fadeIn(.2);

if(activePlayerAction){

activePlayerAction.fadeOut(.2);

}

next.play();

activePlayerAction=next;

}

}


// =====================================================
// 8. NPC
// =====================================================

const npcs=[];

let tommyModel=null;
let tommyAnimations=[];

loader.load(
'./tommy_vercetti_cutscene_model.glb',

gltf=>{

tommyModel=gltf.scene;
tommyAnimations=gltf.animations||[];

updateNPCModels();

},

undefined,

()=>console.log("Dùng NPC mặc định")

);

function createNPC(x,z){

const object=new THREE.Group();

const rig=createCharacter(
new THREE.Color().setHSL(Math.random(),.65,.5)
);

object.add(rig);

object.position.set(x,0,z);

scene.add(object);

npcs.push({

object,
rig,

direction:Math.random()*Math.PI*2,

timer:100+Math.random()*200,

animationTime:Math.random()*10,

walking:true,

modelLoaded:false,

mixer:null,

v09Dodging:false

});

}

for(let i=0;i<30;i++){

createNPC(
Math.random()*300-150,
Math.random()*300-150
);

}

function updateNPCModels(){

if(!tommyModel)return;

npcs.forEach(npc=>{

if(npc.modelLoaded)return;

const model=cloneSkeleton(tommyModel);

normalizeModel(model,1.8);

npc.object.remove(npc.rig);
npc.object.add(model);

npc.model=model;

if(tommyAnimations.length){

npc.mixer=new THREE.AnimationMixer(model);

const clip=
tommyAnimations.find(c=>/walk|run|idle/i.test(c.name))
||tommyAnimations[0];

npc.walkAction=npc.mixer.clipAction(clip);

npc.walkAction.play();

}

npc.modelLoaded=true;

});

}


// =====================================================
// 9. CARS
// =====================================================

const cars=[];

let carModel=null;

loader.load(
'./3d_vapid_creado_gta_vi_game-ready_low_poly.glb',

gltf=>{

carModel=gltf.scene;

normalizeModel(carModel,1.7);

updateCarModels();

},

undefined,

()=>console.log("Dùng xe mặc định")

);

function createCar(x,z,traffic=false){

const object=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(2.2,.8,4.5),

new THREE.MeshStandardMaterial({
color:traffic?0x1565c0:0xc62828,
metalness:.3
})

);

body.position.y=.8;

object.add(body);

const cabin=new THREE.Mesh(
new THREE.BoxGeometry(1.8,.8,2),
new THREE.MeshStandardMaterial({color:0x222222})
);

cabin.position.set(0,1.5,-.3);

object.add(cabin);

const wheels=[];

for(const wx of [-1.1,1.1]){

for(const wz of [-1.4,1.4]){

const wheel=new THREE.Mesh(
new THREE.CylinderGeometry(.4,.4,.25,16),

new THREE.MeshStandardMaterial({color:0x111111})
);

wheel.rotation.z=Math.PI/2;
wheel.position.set(wx,.4,wz);

object.add(wheel);

wheels.push(wheel);

}

}

object.position.set(x,0,z);

scene.add(object);

const car={

object,
wheels,

traffic,

trafficSpeed:10+Math.random()*8,

currentSpeed:10,

direction:1,

axis:"x",

speed:0,

damage:0,

damageCooldown:0,

v09BounceCooldown:0

};

cars.push(car);

return car;

}

const playerCar=createCar(5,0,false);

playerCar.object.rotation.y=Math.PI;

for(let i=0;i<8;i++){

const east=createCar(-450+i*80,-6,true);

east.direction=1;
east.axis="x";
east.object.rotation.y=Math.PI/2;

const west=createCar(450-i*80,6,true);

west.direction=-1;
west.axis="x";
west.object.rotation.y=-Math.PI/2;

const north=createCar(-6,-420+i*115,true);

north.axis="z";
north.direction=1;

const south=createCar(6,420-i*115,true);

south.axis="z";
south.direction=-1;
south.object.rotation.y=Math.PI;

}

function updateCarModels(){

if(!carModel)return;

cars.forEach(car=>{

if(car.modelLoaded)return;

const model=cloneSkeleton(carModel);

car.object.add(model);

car.modelLoaded=true;

});

}


// =====================================================
// 10. SHOP
// =====================================================

const shopBuilding=new THREE.Mesh(
new THREE.BoxGeometry(12,5,12),
new THREE.MeshStandardMaterial({color:0xf0a32d})
);

shopBuilding.position.set(35,2.5,35);

scene.add(shopBuilding);

const shopRoof=new THREE.Mesh(
new THREE.BoxGeometry(14,.8,14),
new THREE.MeshStandardMaterial({color:0xb52c27})
);

shopRoof.position.set(35,5.4,35);

scene.add(shopRoof);


// =====================================================
// 11. BACKROOMS BUILDING
// =====================================================

const backroomsBuilding=new THREE.Group();

const backroomsBody=new THREE.Mesh(
new THREE.BoxGeometry(16,10,16),

new THREE.MeshStandardMaterial({
color:0x30343a,
roughness:.8
})
);

backroomsBody.position.y=5;

backroomsBuilding.add(backroomsBody);

const backroomsDoor=new THREE.Mesh(
new THREE.BoxGeometry(5,6,.4),

new THREE.MeshStandardMaterial({
color:0x171717
})
);

backroomsDoor.position.set(0,3,8.15);

backroomsBuilding.add(backroomsDoor);

const sign=new THREE.Mesh(
new THREE.BoxGeometry(10,2,.5),

new THREE.MeshBasicMaterial({
color:0xffd52b
})
);

sign.position.set(0,10,7);

backroomsBuilding.add(sign);

backroomsBuilding.position.set(65,0,65);

scene.add(backroomsBuilding);


// =====================================================
// 12. BACKROOMS WORLD
// =====================================================

let backroomsMode=false;

let backroomsReturnPoint=new THREE.Vector3();

const backroomsGroup=new THREE.Group();

const backFloor=new THREE.Mesh(
new THREE.BoxGeometry(180,1,180),

new THREE.MeshStandardMaterial({
color:0x8e8247,
roughness:1
})
);

backFloor.position.y=-.6;

backroomsGroup.add(backFloor);

const backCeiling=new THREE.Mesh(
new THREE.BoxGeometry(180,1,180),

new THREE.MeshStandardMaterial({
color:0xb4a95d
})
);

backCeiling.position.y=9;

backroomsGroup.add(backCeiling);

const backWallMat=new THREE.MeshStandardMaterial({
color:0xc5b85b,
roughness:1
});

function createBackroomsWall(x,y,z,w,h,d){

const wall=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
backWallMat
);

wall.position.set(x,y,z);

backroomsGroup.add(wall);

}

createBackroomsWall(0,4,-90,180,9,2);
createBackroomsWall(0,4,90,180,9,2);
createBackroomsWall(-90,4,0,2,9,180);
createBackroomsWall(90,4,0,2,9,180);

for(let i=-60;i<=60;i+=30){

createBackroomsWall(i,4,-35,2,9,70);
createBackroomsWall(i,4,35,2,9,70);

}


// =====================================================
// 13. BACKROOMS LIGHTS
// =====================================================

const backroomsLights=[];

for(let x=-70;x<=70;x+=20){

for(let z=-70;z<=70;z+=25){

const lamp=new THREE.Mesh(
new THREE.BoxGeometry(5,.25,1.5),

new THREE.MeshBasicMaterial({
color:0xfff2a0
})
);

lamp.position.set(x,8.3,z);

backroomsGroup.add(lamp);

const light=new THREE.PointLight(
0xffe69b,
1.2,
22
);

light.position.set(x,7.5,z);

backroomsGroup.add(light);

backroomsLights.push(light);

}

}


// =====================================================
// 14. BACKROOMS EXIT
// =====================================================

const exitWall=new THREE.Mesh(
new THREE.BoxGeometry(9,5,.5),

new THREE.MeshStandardMaterial({
color:0x245a37,
emissive:0x12351e
})
);

exitWall.position.set(0,2.5,-82);

backroomsGroup.add(exitWall);

const exitText=document.createElement("div");

exitText.style.position="fixed";
exitText.style.left="50%";
exitText.style.top="50%";
exitText.style.transform="translate(-50%,-50%)";
exitText.style.color="#6aff91";
exitText.style.fontSize="27px";
exitText.style.fontWeight="bold";

let joy={x:0,y:0};

const joyBase=document.getElementById("joyBase");

const joyKnob=document.getElementById("joyKnob");

let joyPointer=null;

function setJoystick(e){

const r=joyBase.getBoundingClientRect();

const cx=r.left+r.width/2;
const cy=r.top+r.height/2;

let dx=e.clientX-cx;
let dy=e.clientY-cy;

const max=r.width*.34;

const len=Math.hypot(dx,dy);

if(len>max){

dx=dx/len*max;
dy=dy/len*max;

}

joy.x=dx/max;
joy.y=dy/max;

joyKnob.style.left=`${50+joy.x*34}%`;

joyKnob.style.top=`${50+joy.y*34}%`;

}

document.getElementById("joystick").addEventListener(
"pointerdown",
e=>{

e.preventDefault();

joyPointer=e.pointerId;

e.currentTarget.setPointerCapture(e.pointerId);

setJoystick(e);

}
);

document.getElementById("joystick").addEventListener(
"pointermove",
e=>{

if(e.pointerId===joyPointer){

setJoystick(e);

}

}
);

function resetJoy(){

joyPointer=null;

joy.x=0;
joy.y=0;

joyKnob.style.left="50%";
joyKnob.style.top="50%";

}

function movePlayer(delta){

if(currentCar)return;

let forward=0;
let side=0;

if(keys.w||keys.arrowup)forward+=1;

if(keys.s||keys.arrowdown)forward-=1;

if(keys.a||keys.arrowleft)side-=1;

if(keys.d||keys.arrowright)side+=1;

forward+=-joy.y;

side+=joy.x;

const len=Math.hypot(forward,side);

if(len>1){

forward/=len;
side/=len;

}

const speed=
(keys.shift||document.getElementById("run").dataset.down==="1")
?9:5;

const dx=(
-Math.sin(cameraAngle)*forward+
Math.cos(cameraAngle)*side
)*speed*delta;

const dz=(
-Math.cos(cameraAngle)*forward-
Math.sin(cameraAngle)*side
)*speed*delta;

const old=player.position.clone();

player.position.x+=dx;

player.position.z+=dz;

checkBuildingCollision(player,.7);

if(player.position.distanceTo(old)>.001){

player.rotation.y=Math.atan2(dx,dz);

const parts=playerRig.userData.parts;

if(parts){

const swing=Math.sin(performance.now()*.012)*.55;

parts.leftLeg.rotation.x=swing;
parts.rightLeg.rotation.x=-swing;

parts.leftArm.rotation.x=-swing;
parts.rightArm.rotation.x=swing;

}

playPlayerAnimation(speed>5?"run":"walk");

}else{

playPlayerAnimation("idle");

}

}

-480,
480
);

}

// 25. NPC VEHICLE AVOIDANCE
// =====================================================

function updateNPCAvoidance(delta){

if(backroomsMode)return;

npcs.forEach(npc=>{

const npcPos=npc.object.position;

let nearestCar=null;

let nearestDistance=12;

cars.forEach(car=>{

const distance=npcPos.distanceTo(
car.object.position
);

if(distance<nearestDistance){

nearestDistance=distance;

nearestCar=car;

}

});

if(!nearestCar)return;

if(nearestDistance<9){

const away=new THREE.Vector3()
.subVectors(
npcPos,
nearestCar.object.position
);

away.y=0;

if(away.lengthSq()>.001){

away.normalize();

npc.object.position.add(
away.multiplyScalar(delta*5)
);

npc.object.rotation.y=Math.atan2(
away.x,
away.z
);

npc.walking=true;

npc.timer=40;

npc.v09Dodging=true;

}

}else{

npc.v09Dodging=false;

}

});

}


// =====================================================
// 26. TRAFFIC AND PLAYER CAR
// =====================================================

function updateCars(delta){

cars.forEach(car=>{

if(car.damageCooldown>0){

car.damageCooldown=Math.max(
0,
car.damageCooldown-delta
);

}

if(car.v09BounceCooldown>0){

car.v09BounceCooldown=Math.max(
0,
car.v09BounceCooldown-delta
);

}

const obj=car.object;

if(car.traffic){

let target=car.trafficSpeed;

for(const other of cars){

if(other===car||!other.traffic)continue;

if(
other.direction!==car.direction||
other.axis!==car.axis
)continue;

if(obj.position.distanceTo(other.object.position)<10){

target=0;

}

}

car.currentSpeed=THREE.MathUtils.lerp(
car.currentSpeed,
target,
delta*2
);

if(car.axis==="z"){

obj.position.z+=
car.currentSpeed*delta*car.direction;

obj.rotation.y=car.direction===1?0:Math.PI;

if(car.direction===1&&obj.position.z>500){

obj.position.z=-500;

}

if(car.direction===-1&&obj.position.z<-500){

obj.position.z=500;

}

}else{

obj.position.x+=
car.currentSpeed*delta*car.direction;

obj.rotation.y=
car.direction===1?Math.PI/2:-Math.PI/2;

if(car.direction===1&&obj.position.x>500){

obj.position.x=-500;

}

if(car.direction===-1&&obj.position.x<-500){

obj.position.x=500;

}

}

}

else if(currentCar===car){

const accel=(
keys.w||
keys.arrowup||
joy.y<-.2
)?1:0;

const brake=(
keys.s||
keys.arrowdown||
joy.y>.2
)?1:0;

car.speed+=accel*18*delta;

car.speed-=brake*24*delta;

car.speed*=Math.pow(.985,delta*60);

car.speed=THREE.MathUtils.clamp(
car.speed,
-12,
30
);

if(keys.a||keys.arrowleft||joy.x<-.2){

obj.rotation.y+=2*delta*(car.speed>=0?1:-1);

}

if(keys.d||keys.arrowright||joy.x>.2){

obj.rotation.y-=2*delta*(car.speed>=0?1:-1);

}

obj.position.x+=
Math.sin(obj.rotation.y)*car.speed*delta;

obj.position.z+=
Math.cos(obj.rotation.y)*car.speed*delta;

const hitBuilding=checkBuildingCollision(obj,2);

if(hitBuilding&&Math.abs(car.speed)>5){

damageCar(
car,
Math.min(8,Math.abs(car.speed)*.12)
);

car.speed*=-.22;

}

}

});

}


// =====================================================
// 27. ARCADE CAR COLLISIONS
// =====================================================

function updateCarBounces(){

if(!currentCar)return;

const car=currentCar;

if(car.v09BounceCooldown>0)return;

cars.forEach(other=>{

if(other===car)return;

const distance=car.object.position.distanceTo(
other.object.position
);

if(distance<3.5){

car.v09BounceCooldown=.6;

other.v09BounceCooldown=.6;

car.speed*=-.35;

if(other.traffic){

other.currentSpeed*=.45;

}

const direction=new THREE.Vector3()
.subVectors(
car.object.position,
other.object.position
);

if(direction.lengthSq()>.001){

direction.normalize();

car.object.position.add(
direction.multiplyScalar(1.2)
);

}

showMessage("Va chạm xe! 🚗");

}

});

}

// 39. MINIMAP

const mapCanvas=document.getElementById("minimap");

const mapCtx=mapCanvas.getContext("2d");

function drawMinimap(){

const w=mapCanvas.width;
const h=mapCanvas.height;

mapCtx.clearRect(0,0,w,h);

mapCtx.fillStyle=backroomsMode?"#887c42":"#284c3c";

mapCtx.fillRect(0,0,w,h);

mapCtx.strokeStyle="#888";

mapCtx.lineWidth=7;

for(let i=0;i<w;i+=26){

mapCtx.beginPath();

mapCtx.moveTo(i,0);

mapCtx.lineTo(i,h);

mapCtx.stroke();

mapCtx.beginPath();

mapCtx.moveTo(0,i);

mapCtx.lineTo(w,i);

mapCtx.stroke();

}

const pos=currentCar
?currentCar.object.position
:player.position;

const px=w/2+pos.x*.18;

const py=h/2+pos.z*.18;

mapCtx.fillStyle="#ff3333";

mapCtx.beginPath();

mapCtx.arc(px,py,7,0,Math.PI*2);

mapCtx.fill();

if(missionActive&&!backroomsMode){

mapCtx.fillStyle="#ffcf48";

mapCtx.beginPath();

mapCtx.arc(
w/2+missionTarget.x*.18,
h/2+missionTarget.z*.18,
6,
0,
Math.PI*2
);

mapCtx.fill();

}

}


// =====================================================
// 40. MAIN LOOP
// =====================================================

const clock=new THREE.Clock();

function animate(){

const delta=Math.min(clock.getDelta(),.05);

if(currentCar){

player.position.copy(currentCar.object.position);

}else{

movePlayer(delta);

verticalVelocity-=16*delta;

player.position.y+=verticalVelocity*delta;

if(player.position.y<=0){

player.position.y=0;

verticalVelocity=0;

grounded=true;

}

}

updateNPCs(delta);

updateNPCAvoidance(delta);

updateCars(delta);

updateCarBounces();

updateMission();

updateNPCModels();

updateBackrooms();

updateBackroomsLights(delta);

updateBackroomsAtmosphere(delta);

updateCamera();

drawMinimap();

if(playerMixer){

playerMixer.update(delta);

}

renderer.render(scene,camera);

}

renderer.setAnimationLoop(animate);


// =====================================================
// 41. RESIZE
// =====================================================

window.addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setPixelRatio(
Math.min(devicePixelRatio||1,1.35)
);

renderer.setSize(innerWidth,innerHeight);

});


// =====================================================
// 42. WEBGL CONTEXT
// =====================================================

renderer.domElement.addEventListener(
"webglcontextlost",
e=>{

e.preventDefault();

renderer.setAnimationLoop(null);

showMessage("Mất kết nối WebGL. Hãy tải lại trang.");

}
);


// =====================================================
// 43. START
// =====================================================

updateMoney();

console.log("GTA VI FANMADE v0.9 READY!");

</script>
